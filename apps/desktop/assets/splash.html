<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .splash {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(243, 246, 255, 0.88));
    border: 1px solid rgba(120, 140, 190, 0.18);
    border-radius: 18px;
    box-shadow: 0 14px 44px rgba(20, 30, 80, 0.2);
  }
  .icon { width: 44px; height: 44px; object-fit: contain; }
  .title {
    font-size: 15px;
    font-weight: 600;
    color: #1f2430;
    letter-spacing: 0.2px;
  }
  .spinner {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 3px solid rgba(77, 107, 254, 0.16);
    border-top-color: #4d6bfe;
    animation: spin 0.8s linear infinite;
  }
  .hint {
    font-size: 12px;
    color: #737c92;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="splash">
    <img class="icon" src="icon.png" alt="" draggable="false">
    <div class="title">DeepSeek Harness</div>
    <div class="spinner"></div>
    <div class="hint">正在启动…</div>
  </div>
</body>
</html>
